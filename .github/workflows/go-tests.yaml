name: Go Test

on:
  push:
    branches:
      - main
      - 'dev*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'dev*'

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21.x', '1.24.x']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Vet
      run: go vet ./...

    - name: Run tests
      run: go test -race -count=1 ./...
